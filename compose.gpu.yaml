# Gives Tdarr the host's NVIDIA GPU (NVENC/NVDEC). Needs the NVIDIA driver and the NVIDIA Container Toolkit on the
# host (docs/installing.md). Used on the host through COMPOSE_FILE=compose.yaml:compose.gpu.yaml in .env; CI and the
# smoke test leave it out, since their runners have no GPU. A reservation, not a device mapping or privileged mode:
# the policy check refuses those (docs/security.md#policy).
services:
  tdarr:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
