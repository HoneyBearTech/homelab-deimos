# The Deimos stack: Tdarr (media transcoding and health checks), Spoolman (filament inventory), the AMS app that
# keeps Spoolman in step with the printers' material systems, Mealie (recipes and meal plans) and social-to-mealie
# (imports recipes from social-media posts into Mealie), qBittorrent and torrent-watch (adds new torrents to it from a
# model index), plus autoheal (behind a filtering socket proxy) to restart any of them that turns unhealthy, and a
# Dozzle agent that serves the host's container logs to the homelab's Dozzle on another host. Every setting comes from
# .env (template: .env.example; reference: docs/interfaces.md); autoheal's
# optional webhook from autoheal.env (template: autoheal.env.example), Spoolman's optional database server from
# spoolman.env (template: spoolman.env.example), social-to-mealie's API keys from social-to-mealie.env (template:
# social-to-mealie.env.example), the
# Dozzle agent's certificate and key from files under CONFIG_ROOT/dozzle/certs, Mealie's database URL from a file under
# CONFIG_ROOT/mealie/secrets, Spoolman's database password from one under CONFIG_ROOT/spoolman/secrets and
# torrent-watch's qBittorrent password from one under CONFIG_ROOT/torrent-watch/secrets (Docker secrets, at the end).
# Every image is
# pinned as name:tag@sha256:<digest> and publishes linux/amd64; Dependabot proposes updates. scripts/check_compose.py
# enforces the policy (docs/security.md#policy).
#
# The GPU is not in this file: compose.gpu.yaml reserves it for Tdarr, and the host's .env adds that file with
# COMPOSE_FILE=compose.yaml:compose.gpu.yaml. CI and the smoke test run this file alone, on runners without a GPU.
name: homelab-deimos

# Every service starts with no Linux capabilities and can't gain privileges (setuid binaries, file capabilities);
# a service that needs a capability adds back only that one, from Docker's default set (docs/security.md#hardening).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Health check timing shared by every service; each service adds its own test. During start_period a failing check
# doesn't count, and Docker checks every start_interval, so a healthy service shows up within seconds. The long
# start_period keeps autoheal from restarting a service in the middle of a slow database migration after an upgrade
# (start_interval needs Docker Engine 25 and Compose 2.24).
x-healthcheck: &healthcheck
  interval: 1m
  timeout: 10s
  retries: 3
  start_period: 10m
  start_interval: 5s

services:
  tdarr:
    <<: *hardened
    # Server with its internal node. Every Tdarr update is merged by hand after reading its release notes (it rewrites
    # the media library), so Dependabot's auto-merge skips it.
    image: ghcr.io/haveagitgat/tdarr:3.04.00@sha256:0ea9217f69f40e49977dbcbc0319224e625c90d808d39bf075483fe45e9612f1
    container_name: tdarr
    restart: unless-stopped
    # Its init (s6-overlay) runs as root and needs these of Docker's default capabilities: it takes ownership of its
    # own directories, never /media (CHOWN), records that in /app/server/perm, which then belongs to abc
    # (DAC_OVERRIDE), starts the server and the node as its user abc (SETUID, SETGID) and stops them on shutdown
    # (KILL). The server and node run as abc with no capabilities, so their access to the media library is unchanged.
    # Its root filesystem stays writable: s6 runs its init from /run, and Tdarr updates its plugins and its own
    # server and node files inside the image.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - KILL
    environment:
      TZ: ${TZ:?set TZ in .env}
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      UMASK_SET: "002"
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      # The internal node's settings (worker limits) are stored under its name: keep it.
      nodeName: MyInternalNode
      ffmpegVersion: "7"
      # Tdarr's own login is off: keep the web UI on the LAN, behind the reverse proxy's access list.
      auth: "false"
      maxLogSizeMB: "10"
    labels:
      autoheal: "true"
      # The library is far too large to back up here and lives on its own storage; the cache and logs are
      # disposable (scripts/lib.sh).
      org.honeybeartech.deimos.backup.skip: "/media, /temp, /app/logs"
    ports:
      - "8265:8265" # web UI: keep it on the LAN
      - "8266:8266" # server port for Tdarr nodes on other machines
    volumes:
      # Its database (server), settings (config), logs and transcode cache: host directories under CONFIG_ROOT, never
      # Docker volumes (docs/installing.md#where-data-lives).
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/tdarr/server:/app/server
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/tdarr/config:/app/configs
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/tdarr/logs:/app/logs
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/tdarr/transcode:/temp
      # Tdarr stores every file's path under /media in its database: keep the container path.
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8265/api/v2/status"]

  spoolman:
    <<: *hardened
    # Migrates its database forward on the first start of a new version (back up first: docs/upgrading.md), and keeps
    # nightly database backups of its own in its data directory (backups/).
    image: ghcr.io/donkie/spoolman:0.27.1@sha256:1ebb4f6a62c2e72a07f18b07ebfdbd96322f5bc2eb72570af3088f68d7c393b1
    container_name: spoolman
    restart: unless-stopped
    # Its entrypoint starts as root and switches to its user (gosu), which needs these two. Keep PUID/PGID at 1000,
    # its user's ids: for any other it rewrites /etc/passwd, which the read-only root refuses.
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:?set TZ in .env}
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      # Its database password (the secrets at the end), used only when spoolman.env points it at a database server.
      SPOOLMAN_DB_PASSWORD_FILE: /run/secrets/spoolman_db_password
    # Optional: its database on a PostgreSQL server instead of SQLite in its folder (template: spoolman.env.example).
    # Spoolman refuses an empty database setting, so these can't be settings in .env with empty defaults.
    env_file:
      - path: spoolman.env
        required: false
    labels:
      autoheal: "true"
    ports:
      - "7912:8000" # web UI and REST API: keep it on the LAN
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/spoolman/config:/home/app/.local/share/spoolman
    secrets:
      - spoolman_db_password
    healthcheck:
      <<: *healthcheck
      # The image has neither curl nor wget; its Python asks the health endpoint.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health", timeout=5)

  ams:
    <<: *hardened
    # HaspelSync: Bambu Lab AMS to Spoolman sync (formerly bambulab-ams-spoolman-filamentstatus). The printers'
    # serial numbers, addresses and access codes live in /app/printers/printers.json, in plain text, next to the
    # settings saved in its web UI (settings.json): never in this repository, and backups of it are secret.
    image: ghcr.io/rdiger-36/haspelsync:1.3.7@sha256:3f0a7217d4c48835fbd02a73723145712006a954e1e7d0b46a210a06947c8022
    container_name: haspelsync
    restart: unless-stopped
    # Its image would run it as root; it runs as PUID:PGID instead, which own its printers and logs directories, so
    # it needs no capability. It writes nowhere else, and its entrypoint only starts node.
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:?set TZ in .env}
      # Spoolman in this stack, by its service name; the public URL is what the app's links point at. Since 1.3 these
      # only seed a setting until it is first saved in the web UI (printers/settings.json then owns it), and it logs a
      # deprecation notice while they are in charge; kept so that a fresh installation finds Spoolman on its own.
      SPOOLMAN_ENDPOINT: http://spoolman:8000
      SPOOLMAN_FQDN: ${SPOOLMAN_PUBLIC_URL:?set SPOOLMAN_PUBLIC_URL in .env}
      UPDATE_INTERVAL: "120000"
      MODE: automatic
      NEVER_MERGE_IF_TAG: "true"
    labels:
      autoheal: "true"
      org.honeybeartech.deimos.backup.skip: "/app/logs"
    ports:
      - "4000:4000" # web UI: keep it on the LAN
    volumes:
      # Under the app's own name (its container name), not the service's: CONFIG_ROOT/haspelsync/.
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/haspelsync/config:/app/printers
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/haspelsync/logs:/app/logs
    depends_on:
      spoolman:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/"]

  mealie:
    <<: *hardened
    # Recipes, meal plans and shopping lists. Its database is PostgreSQL on another server, never in this stack: the
    # connection URL, with the login's password, is a Docker secret (the secrets at the end). It migrates that database
    # forward on the first start of a new version, so a backup there comes first (docs/upgrading.md).
    image: ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784
    container_name: mealie
    restart: unless-stopped
    # Its image would start as root, change its own user's ids to PUID/PGID, take ownership of /app and switch to that
    # user, which takes capabilities. Started as PUID:PGID instead, it skips all of that (PUID must match), so it needs
    # no capability; it writes only its data folder and /tmp.
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:?set TZ in .env}
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      # The address people open it at; the links in its notifications and shared recipes point there.
      BASE_URL: ${MEALIE_PUBLIC_URL:?set MEALIE_PUBLIC_URL in .env}
      # Accounts only by invitation, from an administrator (Mealie's default, kept explicit).
      ALLOW_SIGNUP: "false"
      DB_ENGINE: postgres
      POSTGRES_URL_OVERRIDE_FILE: /run/secrets/mealie_database_url
    labels:
      autoheal: "true"
    ports:
      - "9925:9000" # web UI and API: keep it on the LAN
    volumes:
      # Its recipe images, its own backups and the keys it signs sign-ins with.
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/mealie/config:/app/data
    secrets:
      - mealie_database_url
    # Mealie's own example limits it to 1000 MB.
    deploy:
      resources:
        limits:
          memory: 1000M
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/app/healthcheck.sh"]

  social-to-mealie:
    <<: *hardened
    # Imports a recipe from a social-media post (Instagram, TikTok, YouTube Shorts and the like) into Mealie: yt-dlp, or
    # gallery-dl for picture posts, fetches the post, OpenAI's API transcribes its audio and writes the recipe, and it
    # posts that to Mealie in this stack. It has no login of its own: keep it on the LAN, behind the reverse proxy's
    # access list. Versions before 1.8.2 let anyone who reached it run commands in it (GHSA-r63c-m6m6-mvh3).
    image: ghcr.io/gerardpollorebozado/social-to-mealie:v1.8.2@sha256:fc63ef76f0dda92ebd97213c5772fccfacf985e382336eccd5df5cf1af61f5b1
    container_name: social-to-mealie
    restart: unless-stopped
    # Its image runs it as its own user, so it needs no capability; it writes only its temporary files and Next.js'
    # cache.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    environment:
      TZ: ${TZ:?set TZ in .env}
      # The yt-dlp built into the pinned image. By default its entrypoint would install the newest one from PyPI at
      # each start: code nobody here reviewed, in a container that holds both API keys.
      YTDLP_VERSION: none
      OPENAI_URL: https://api.openai.com/v1
      # Mealie in this stack, by its service name; the recipe links it shows point at Mealie's public address.
      MEALIE_URL: http://mealie:9000
      EXTERNAL_MEALIE_URL: ${MEALIE_PUBLIC_URL:?set MEALIE_PUBLIC_URL in .env}
    # Its API keys and the models it uses (template: social-to-mealie.env.example). It reads them only from its
    # environment. Without the file it starts, but every import fails.
    env_file:
      - path: social-to-mealie.env
        required: false
    labels:
      autoheal: "true"
    ports:
      - "9926:3000" # web UI: keep it on the LAN
    healthcheck:
      <<: *healthcheck
      # Its web app manifest, which the app answers by itself; its home page would ask Mealie as well.
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/manifest.webmanifest")
          .then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))

  qbittorrent-direct:
    <<: *hardened
    # A torrent client for files you're free to share: it makes torrents, seeds them, and downloads from torrent files
    # and magnet links. Its peers see the public address this host reaches the internet from (docs/security.md), and the
    # only app in this stack that talks to it is torrent-watch.
    # linuxserver.io's version tag names qBittorrent and the libtorrent it is built on: 2.1, whose disk I/O reads and
    # writes files instead of mapping them into memory, which suits a network share (docs/dependencies.md#qbittorrent).
    # Dependabot follows this tag's rebuilds but can't read it as a version: a new qBittorrent is bumped by hand.
    image: lscr.io/linuxserver/qbittorrent:version-5.3.0_v2.1.2@sha256:05c1454f9a32967affc1f34f67f8cc0cc57dd805dca45489fe797095a6286556
    container_name: qbittorrent-direct
    # Its init (s6-overlay) runs as root: it takes ownership of the data for PUID:PGID (CHOWN), runs the app as that
    # user (SETUID, SETGID) and stops it cleanly on shutdown (KILL: without it the app is killed after the timeout).
    # Its root filesystem stays writable: the init runs from /run (a tmpfs there is mounted noexec, so it can't
    # start) and writes to the image's own directories.
    # DAC_OVERRIDE: the init, as root, writes the default settings into a data directory that belongs to PUID.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - KILL
    restart: unless-stopped
    # Time to finish writing to a network share and exit cleanly on stop (as for the nightly backup) instead of being
    # killed after Docker's default 10 s in the middle of a write.
    stop_grace_period: 1m
    # A torrent client keeps a file open for every file of every active torrent, and containerd 2.x gives containers a
    # default limit of 1024 open files, which a few large torrents can use up ("Too many open files").
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    labels:
      autoheal: "true"
      # The torrents' files are large, and live on storage of their own; only the settings are backed up.
      org.honeybeartech.deimos.backup.skip: "/downloads"
    environment:
      TZ: ${TZ:?set TZ in .env}
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      # The same port on both sides of the mapping below: qBittorrent answers "Unauthorized" to a request whose Host
      # header names a port other than its own.
      WEBUI_PORT: 8091
      TORRENTING_PORT: 50881
    ports:
      - "8091:8091" # web UI and API: keep it on the LAN, and never forward it
      - "50881:50881" # peers: the one port to forward from the router
      - "50881:50881/udp"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/qbittorrent-direct/config:/config
      # Every path set in qBittorrent must be under /downloads: anything else is lost when the container is recreated.
      - ${TORRENTS_PATH:?set TORRENTS_PATH in .env}:/downloads
    healthcheck:
      <<: *healthcheck
      # The web UI's login page answers without a login.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8091/"]

  torrent-watch:
    <<: *hardened
    # Adds new torrents from a model index to qBittorrent, within the limits below (docs/installing.md#torrent-watch).
    # With no watch terms it does nothing. It is this repository's own script, on the standard library alone, run in
    # Python's image rather than built into one (the policy refuses building images).
    image: python:3.14.8-alpine3.24@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    container_name: torrent-watch
    restart: unless-stopped
    # It runs as PUID:PGID, which own its folder, so it needs no capability. It writes only its state file and /tmp.
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    read_only: true
    tmpfs:
      - /tmp # the heartbeat its health check reads
    command: ["python", "-I", "/app/torrent_watch.py"]
    environment:
      TZ: ${TZ:?set TZ in .env}
      TORRENT_WATCH_INDEX_URL: ${TORRENT_WATCH_INDEX_URL:-}
      TORRENT_WATCH_TERMS: ${TORRENT_WATCH_TERMS:-}
      TORRENT_WATCH_AT_RISK: ${TORRENT_WATCH_AT_RISK:-false}
      TORRENT_WATCH_MAX_TORRENT_GB: ${TORRENT_WATCH_MAX_TORRENT_GB:-100}
      TORRENT_WATCH_MAX_TOTAL_GB: ${TORRENT_WATCH_MAX_TOTAL_GB:-500}
      TORRENT_WATCH_MIN_FREE_GB: ${TORRENT_WATCH_MIN_FREE_GB:-500}
      TORRENT_WATCH_QBITTORRENT_USERNAME: ${TORRENT_WATCH_QBITTORRENT_USERNAME:-admin}
      # The script's checksum (a test checks it): Compose doesn't recreate a container when only a file mounted into it
      # changes, and a pull replaces that file, which leaves the running container's mount pointing at nothing.
      TORRENT_WATCH_SCRIPT_SHA256: 588bb2efc951e8f61412be4c460fd6c689b5ddd57de68216c13da7a53dd05623
    labels:
      autoheal: "true"
    volumes:
      # What it has already seen, so that it adds each torrent once.
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/torrent-watch/config:/config
    configs:
      - source: torrent_watch
        target: /app/torrent_watch.py
    secrets:
      - qbittorrent_password
    healthcheck:
      <<: *healthcheck
      # That a poll has started recently; the index or qBittorrent being down is in its log, and a restart can't fix it.
      test: ["CMD", "python", "-I", "/app/torrent_watch.py", "--healthcheck"]

  # A Dozzle agent: it serves this host's container logs to the homelab's Dozzle on another host, which shows the
  # logs of every host in one web UI. It has no web UI of its own. Keep it on the hub's version. It accepts only a hub
  # that presents the homelab's own certificate and key (the secrets at the end), never the pair built into every
  # Dozzle image, which anyone can use.
  dozzle-agent:
    <<: *hardened
    image: amir20/dozzle:v11.4.0@sha256:d23d23ce02c8cc96416dfbad4a7de225d01fdc03ad310203d64d580034dd120d
    container_name: dozzle-agent
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp # its address file, read by the health check
      - /data # the notification settings the Dozzle hub sends it, which the hub sends again each time it starts
    command: agent
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/dozzle", "healthcheck"]
    labels:
      autoheal: "true"
      org.honeybeartech.deimos.allow.docker-socket: >-
        The Dozzle agent reads container logs through the Docker API for the Dozzle hub. The socket is mounted
        read-only, which protects the socket file but not the API, so the agent's port must stay on the LAN.
    environment:
      DOZZLE_CERT: /run/secrets/dozzle_cert
      DOZZLE_KEY: /run/secrets/dozzle_key
    secrets:
      - dozzle_cert
      - dozzle_key
    ports:
      - "7007:7007" # agent port for the Dozzle hub: keep it on the LAN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  autoheal:
    <<: *hardened
    image: willfarrell/autoheal:latest@sha256:e7f42d5365c7c4490dd0cafc2858bb9fd2d64a274448d2de2bb5c386f1af7a0f
    container_name: autoheal
    restart: unless-stopped
    read_only: true
    # autoheal exits if it can't reach the proxy, so it starts only once the proxy answers. (After a host reboot
    # Docker starts both at once; autoheal then restarts until the proxy is up, a few seconds.)
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "pgrep", "-f", "autoheal"]
    labels:
      org.honeybeartech.deimos.allow.latest: >-
        The image publishes "latest" (rebuilt regularly) and versioned tags only up to 1.2.0 from 2021, so the
        maintained image is "latest", pinned by digest.
    environment:
      TZ: ${TZ:?set TZ in .env}
      DOCKER_SOCK: tcp://socket-proxy:2375
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      # Give a service time to shut down cleanly (and finish database writes) before it's restarted.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
      # Discord's webhook API reads the message from "content".
      WEBHOOK_JSON_KEY: content
    env_file:
      - path: autoheal.env
        required: false
    networks:
      - default
      - docker-proxy

  # The socket-proxy answers on an internal network with no published port, and passes on only what autoheal needs:
  # listing and inspecting containers, and restarting or stopping them (CONTAINERS, ALLOW_RESTARTS). Creating,
  # starting or deleting containers, exec, images, volumes and every other POST are refused.
  socket-proxy:
    <<: *hardened
    image: lscr.io/linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    container_name: socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2375/_ping"]
    labels:
      autoheal: "true"
      org.honeybeartech.deimos.allow.docker-socket: >-
        A filtering proxy so that autoheal never gets the socket itself: it allows only listing, inspecting,
        restarting and stopping containers, on an internal network with no published port. The socket mount is
        read-only, which protects the socket file but not the API; the proxy's filter is what limits it.
    environment:
      TZ: ${TZ:?set TZ in .env}
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      POST: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

networks:
  # socket-proxy's network: internal, so nothing on it can reach the outside world and nothing outside can reach
  # the proxy; only autoheal joins it.
  docker-proxy:
    internal: true

# torrent-watch's script, mounted read-only from this repository (the backups copy only read-write mounts).
configs:
  torrent_watch:
    file: ./scripts/torrent_watch.py

# The certificate and key the Dozzle agent and the homelab's Dozzle hub authenticate each other with: one pair, made
# once with `dozzle generate-certs`, the same on the hub and on every agent (docs/installing.md#dozzles-certificate).
# Files on the host, owned by root: the agent runs as root without capabilities, so it can read only a file that root
# owns. Compose mounts each read-only at /run/secrets/<name>, and the agent doesn't start while one is missing, so it
# never falls back to the built-in pair. Never committed, and never in the stack's backups (they copy read-write
# mounts only): keep the key in a password manager.
secrets:
  dozzle_cert:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/dozzle/certs/dozzle_cert.pem
  dozzle_key:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/dozzle/certs/dozzle_key.pem
  # Mealie's database: postgresql://<login>:<password>@<server>:5432/<database>?sslmode=require, one line, in a file
  # owned by PUID:PGID with mode 600 (Mealie runs as that user; docs/installing.md#mealies-database). Never
  # committed, and never in the stack's backups: if it is lost, give the login a new password on the database server.
  mealie_database_url:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/mealie/secrets/database_url
  # Spoolman's database password, alone in the file with no line break after it (Spoolman reads the whole file as the
  # password), owned by PUID:PGID with mode 600 (docs/installing.md#spoolmans-database). Empty while Spoolman keeps
  # its SQLite database. Never committed, and never in the stack's backups.
  spoolman_db_password:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/spoolman/secrets/db_password
  # The password torrent-watch signs in to qBittorrent with, owned by PUID:PGID with mode 600
  # (docs/installing.md#torrent-watch). Never committed, and never in the stack's backups.
  qbittorrent_password:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/torrent-watch/secrets/qbittorrent_password
