default_language_version:
  node: 24.22.3

exclude: '^\.agent/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(README(?:\.[^/]*)?|docs/)'
      - id: end-of-file-fixer
        exclude: '^(README(?:\.[^/]*)?|docs/)'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1 peeled commit
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yml]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/ansible/ansible-lint
    rev: b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
    hooks:
      - id: ansible-lint
        files: '^(ansible|playbooks|roles)/.*\.ya?ml$'
        always_run: false
  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # v2.15.1
    hooks:
      - id: hadolint-docker
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # v0.50.0
    hooks:
      - id: markdownlint
        files: '^(?!README(?:\.[^/]*)?$)(?!docs/).*\.md$'
